name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write       # keyless signing identity for build provenance
  attestations: write   # publish signed provenance for the tarball

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match the workspace version and have release notes
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          [ "v$VERSION" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match Cargo.toml version $VERSION"; exit 1; }
          scripts/release-notes.sh "$VERSION" > release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      AGENTS_ROSTER_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libwayland-dev pkg-config
      - name: Build tarball (paths remapped so no build directory leaks into the binary)
        run: ./scripts/package-release.sh
      - name: Sign build provenance (ties the tarball to this repo, commit and workflow)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          name: Agents Roster ${{ github.ref_name }}
          body_path: out/release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            out/*.tar.gz
            out/*.tar.gz.sha256
