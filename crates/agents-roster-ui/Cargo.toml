[package]
name = "agents-roster-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
build = "build.rs"

[lints.rust]
# Slint's generated `include_modules!` expands `#[allow(unsafe_code)]`, which is incompatible with
# `forbid`; the Windows tray/hints modules additionally call audited Win32 FFI.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[dependencies]
agents-roster-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true
x11rb.workspace = true
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "backend-winit-wayland", "renderer-software", "unstable-winit-030"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }

[build-dependencies]
slint-build.workspace = true
