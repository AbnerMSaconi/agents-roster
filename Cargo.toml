[workspace]
resolver = "3"
members = [
    "crates/agents-roster-core",
    "crates/agents-roster-sources",
    "crates/agents-roster-notify",
    "crates/agents-roster-ui",
    "crates/agents-roster",
]

[workspace.package]
version = "0.4.0"
repository = "https://github.com/AbnerMSaconi/agents-roster"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
agents-roster-core = { path = "crates/agents-roster-core" }
agents-roster-sources = { path = "crates/agents-roster-sources" }
agents-roster-notify = { path = "crates/agents-roster-notify" }
agents-roster-ui = { path = "crates/agents-roster-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
slint-build = "1"

# Linux-only platform backends (SNI tray, freedesktop notifications, X11 hints).
zbus = "5"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
x11rb = "0.13"

# Windows-only platform backend (Win32 process table, tray, DWM hints, WinRT toasts).
# One feature union shared by every crate so the `windows` crate compiles once.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
