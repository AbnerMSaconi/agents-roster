[workspace]
resolver = "3"
members = [
    "crates/agents-roster-core",
    "crates/agents-roster-sources",
    "crates/agents-roster-notify",
    "crates/agents-roster-ui",
    "crates/agents-roster",
]

[workspace.package]
version = "0.3.1"
repository = "https://github.com/AbnerMSaconi/agents-roster"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
agents-roster-core = { path = "crates/agents-roster-core" }
agents-roster-sources = { path = "crates/agents-roster-sources" }
agents-roster-notify = { path = "crates/agents-roster-notify" }
agents-roster-ui = { path = "crates/agents-roster-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zbus = "5"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "backend-winit-wayland", "renderer-software", "unstable-winit-030"] }
raw-window-handle = "0.6"
x11rb = "0.13"
slint-build = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
